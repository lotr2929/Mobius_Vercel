<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2e5231">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mobius">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/logo.png">
<title>Mobius</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#e2dccd;
  --surface:#f5eedd;
  --surface2:#ede5d4;
  --border:#c9bfae;
  --border2:#8d7c64;
  --text:#1b1510;
  --text-muted:#443a2d;
  --text-dim:#8d7c64;
  --green:#2e5231;
  --green-light:#4a7c4e;
  --red:#8d3a3a;
  --code-bg:#2a2118;
  --font:'Century Gothic','Avenir','Segoe UI','Verdana',sans-serif;
  --font-mono:'Cascadia Code','Fira Code','Consolas',monospace;
  --radius:3px;
  --max-w:720px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:var(--max-w);margin:0 auto;position:relative;}

/* ── Header ── */
#header{display:flex;align-items:center;gap:8px;padding:6px 12px 4px;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border);}
#logo{height:44px;width:44px;object-fit:contain;flex-shrink:0;}
#appname{font-size:26px;font-weight:bold;color:var(--green);letter-spacing:-0.5px;}
#header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
#model-badge{font-size:11px;color:var(--text-dim);}
#status-row{display:flex;align-items:center;gap:5px;}
#status-dot{width:7px;height:7px;border-radius:50%;background:var(--green-light);flex-shrink:0;transition:background .3s;}
#status-dot.offline{background:var(--border2);}
#status-dot.searching{background:#c8a84b;}
#clock{font-size:10px;color:var(--text-dim);}

/* ── Chat feed ── */
#feed{flex:1;overflow-y:auto;min-height:0;padding:12px 12px 16px;}
#feed::-webkit-scrollbar{width:4px;}
#feed::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.bubble{margin-bottom:18px;}
.bubble-query{
  background:var(--green);color:#f5f0e8;
  padding:9px 13px;border-radius:14px 14px 4px 14px;
  font-size:14px;line-height:1.5;max-width:88%;margin-left:auto;
  white-space:pre-wrap;word-break:break-word;
}
.bubble-answer{
  background:var(--surface);border:1px solid var(--border);
  padding:10px 13px;border-radius:4px 14px 14px 14px;
  font-size:14px;line-height:1.6;max-width:96%;
}
.bubble-meta{font-size:10px;color:var(--text-dim);margin-top:4px;display:flex;gap:8px;align-items:center;padding-left:2px;}
.ai-badge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1px 6px;font-size:9px;color:var(--text-dim);}
.search-badge{background:#2a1e08;border:1px solid #5a4a2a;border-radius:8px;padding:1px 6px;font-size:9px;color:#c8a84b;}
.copy-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:2px 4px;border-radius:2px;font-size:10px;margin-left:auto;}
.copy-btn:hover{color:var(--text);background:var(--surface2);}
.thinking-dots{color:var(--text-dim);font-style:italic;font-size:13px;}

/* ── Markdown rendering ── */
.bubble-answer h1,.bubble-answer h2,.bubble-answer h3{font-weight:bold;margin:8px 0 3px;color:var(--text-muted);}
.bubble-answer h1{font-size:16px;}.bubble-answer h2{font-size:15px;}.bubble-answer h3{font-size:14px;}
.bubble-answer p{margin:0 0 8px;}.bubble-answer p:last-child{margin:0;}
.bubble-answer ul,.bubble-answer ol{margin:3px 0 8px 18px;}
.bubble-answer li{margin-bottom:3px;}
.bubble-answer table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px;overflow-x:auto;display:block;}
.bubble-answer th,.bubble-answer td{border:1px solid var(--border2);padding:4px 8px;text-align:left;}
.bubble-answer th{background:var(--surface2);font-weight:700;}
.bubble-answer tr:nth-child(even) td{background:var(--surface);}
.bubble-answer hr{border:none;border-top:1px solid var(--border);margin:8px 0;}
.bubble-answer strong{font-weight:700;color:var(--text-muted);}
.bubble-answer code{font-family:var(--font-mono);font-size:11px;background:var(--code-bg);color:#86efac;padding:1px 4px;border-radius:2px;}
.bubble-answer pre{font-family:var(--font-mono);font-size:11px;background:var(--code-bg);color:#d4d4d4;padding:10px 12px;border-radius:2px;overflow-x:auto;margin:6px 0;}
.bubble-answer pre code{background:none;color:inherit;padding:0;}
.bubble-answer a{color:var(--green-light);text-decoration:underline;}

/* ── Input area ── */
#input-area{flex-shrink:0;padding:8px 10px 10px;background:var(--bg);border-top:1px solid var(--border);}
#attach-preview{display:none;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
#attach-preview.has-items{display:flex;}
.attach-thumb{position:relative;width:56px;height:42px;}
.attach-thumb img{width:56px;height:42px;object-fit:cover;border-radius:3px;border:1px solid var(--border);}
.attach-remove{position:absolute;top:-5px;right:-5px;background:var(--text-dim);color:#fff;border:none;border-radius:50%;width:14px;height:14px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#doc-attach-preview{display:none;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
#doc-attach-preview.has-items{display:flex;}
.doc-chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;}
.doc-chip-remove{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:12px;line-height:1;padding:0 2px;}
textarea#qinput{
  width:100%;padding:10px 12px;font-size:15px;
  border-radius:var(--radius);font-family:var(--font);
  resize:none;min-height:52px;max-height:160px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);outline:none;display:block;
  overflow-y:auto;
}
textarea#qinput:focus{border-color:var(--border2);}
textarea#qinput::placeholder{color:var(--text-dim);}
.controls{display:flex;gap:4px;margin-top:5px;align-items:center;}
.icon-btn{background:transparent;border:none;cursor:pointer;padding:4px 5px;border-radius:2px;color:var(--text-dim);display:flex;align-items:center;height:28px;flex-shrink:0;transition:color .15s,background .15s;}
.icon-btn:hover{color:var(--text);background:var(--surface2);}
.icon-btn svg{display:block;}
#send-btn{background:var(--green);border:none;border-radius:var(--radius);cursor:pointer;padding:0 16px;height:28px;display:flex;align-items:center;color:#fff;flex-shrink:0;margin-left:auto;transition:background .15s;font-family:var(--font);font-size:13px;gap:5px;}
#send-btn:hover{background:#3a6b3e;}
#send-btn:disabled{opacity:0.4;cursor:not-allowed;}
.hint{font-size:11px;color:var(--text-dim);margin-left:2px;}

/* ── Docs panel ── */
#docs-panel{
  display:none;position:absolute;bottom:70px;left:8px;right:8px;
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);
  box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:100;max-height:50vh;overflow-y:auto;
}
#docs-panel.open{display:block;}
.dp-header{padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:bold;font-size:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;}
.dp-header button{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:14px;}
.dp-list{padding:4px 10px 10px;}
.dp-item{display:flex;align-items:center;justify-content:space-between;padding:5px 4px;border-bottom:1px solid var(--border);font-size:12px;}
.dp-item:last-child{border-bottom:none;}
.dp-item-name{color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dp-item-del{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:13px;padding:1px 5px;border-radius:2px;flex-shrink:0;}
.dp-item-del:hover{color:var(--red);}
.dp-empty{font-size:12px;color:var(--text-dim);padding:10px 4px;text-align:center;}

/* ── History nav ── */
#hist-nav{display:flex;align-items:center;gap:2px;margin-right:4px;}

/* ── Mobile adjustments ── */
@media (max-width:480px){
  #appname{font-size:22px;}
  #logo{height:36px;width:36px;}
  .bubble-query,.bubble-answer{font-size:13px;}
  textarea#qinput{font-size:16px;} /* prevent iOS zoom */
}
</style>
</head>
<body>
<div id="app">

<!-- Header -->
<div id="header">
  <img id="logo" src="/logo.png" alt="Mobius" onerror="this.style.display='none'">
  <span id="appname">Mobius</span>
  <div id="header-right">
    <div id="status-row">
      <span id="status-dot" class="offline"></span>
      <span id="model-badge">connecting…</span>
    </div>
    <span id="clock"></span>
  </div>
</div>

<!-- Chat feed -->
<div id="feed"></div>

<!-- Input area -->
<div id="input-area">
  <div id="attach-preview"></div>
  <div id="doc-attach-preview"></div>
  <textarea id="qinput" placeholder="Ask anything…" rows="2"></textarea>
  <div class="controls">
    <!-- Image attach -->
    <button class="icon-btn" title="Attach image" onclick="imgInput.click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <!-- Doc attach -->
    <button class="icon-btn" title="Upload document" onclick="toggleDocs()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </button>
    <!-- History nav -->
    <div id="hist-nav">
      <button class="icon-btn" id="btn-older" title="Older" onclick="navHist(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="icon-btn" id="btn-newer" title="Newer" onclick="navHist(1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <span class="hint">Ctrl+↵</span>
    <button class="icon-btn" id="drive-refresh-btn" title="Sync Google Drive now" onclick="triggerDriveSync()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
    <button id="send-btn" onclick="handleSend()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Send
    </button>
  </div>
</div>

<!-- Docs panel -->
<div id="docs-panel">
  <div class="dp-header">
    <span>Documents</span>
    <button onclick="toggleDocs()">&#x2715;</button>
  </div>
  <div style="display:flex;gap:8px;padding:10px;">
    <button onclick="openLocalPicker()" style="flex:1;padding:10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text-muted);cursor:pointer;font-family:var(--font);font-size:12px;">
      📁 Choose files from this device
    </button>
    <button onclick="openGoogleDrive()" style="flex:1;padding:10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text-muted);cursor:pointer;font-family:var(--font);font-size:12px;">
      🗂 Open Google Drive
    </button>
  </div>
  <input type="file" id="docInput" accept=".pdf,.txt,.md,.js,.py,.csv,.json" multiple
         style="display:none" onchange="handleDocFiles(this.files)">
  <div style="padding:5px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;">
    <button id="drive-sync-btn" onclick="triggerDriveSync()" style="font-size:10px;background:none;color:var(--text-dim);border:none;text-decoration:underline;cursor:pointer;padding:2px;">Sync Google Drive folder into Mobius</button>
  </div>
  <div class="dp-list" id="dp-list"></div>
</div>

<!-- Hidden inputs -->
<input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImgFiles(this.files)">

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let busy = false;
let attachedImgs = [];
let attachedDocs = []; // [{filename, text}] — raw text for the NEXT message only
let history = [];   // [{role,content,created_at,ai}]
let histIdx = -1;   // -1 = live view

// ── Clock ──────────────────────────────────────────────────────────────────
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}) + ' ' +
    n.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hour12:true});
}
setInterval(tick, 1000); tick();

// ── Status ─────────────────────────────────────────────────────────────────
async function checkStatus() {
  try {
    const d = await fetch('/api/status').then(r=>r.json());
    document.getElementById('status-dot').className = d.ok ? '' : 'offline';
    document.getElementById('model-badge').textContent = (d.cascade||[]).join(' → ') || 'no AI';
  } catch {
    document.getElementById('status-dot').className = 'offline';
    document.getElementById('model-badge').textContent = 'offline';
  }
}
setInterval(checkStatus, 30000); checkStatus();

// ── Markdown ───────────────────────────────────────────────────────────────
function md(text) {
  if (!text) return '';
  const cbs = [];
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => {
    const s = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    cbs.push('<pre><code>' + s + '</code></pre>');
    return '\x00C' + (cbs.length-1) + '\x00';
  });
  const il = s => s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^\s*].+?)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = text.split('\n'), out = []; let ul=false,ol=false,tbl=[];
  const cl = () => { if(ul){out.push('</ul>');ul=false;} if(ol){out.push('</ol>');ol=false;} };
  const flushTbl = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|?\s*[-:]+[\s|:-]*$/.test(r.trim()));
    out.push('<table>');
    rows.forEach((r,i) => {
      const cells = r.replace(/^\||\|$/g,'').split('|').map(c=>il(c.trim()));
      const t = i===0?'th':'td';
      out.push('<tr>'+cells.map(c=>`<${t}>${c}</${t}>`).join('')+'</tr>');
    });
    out.push('</table>'); tbl=[];
  };
  for (const ln of lines) {
    if (/^\|.+\|/.test(ln.trim())) { cl(); tbl.push(ln); continue; } else flushTbl();
    if (/^####\s/.test(ln)){cl();out.push('<h4>'+il(ln.slice(5))+'</h4>');continue;}
    if (/^###\s/.test(ln)){cl();out.push('<h3>'+il(ln.slice(4))+'</h3>');continue;}
    if (/^##\s/.test(ln)){cl();out.push('<h2>'+il(ln.slice(3))+'</h2>');continue;}
    if (/^#\s/.test(ln)){cl();out.push('<h1>'+il(ln.slice(2))+'</h1>');continue;}
    if (/^[-*]\s/.test(ln)){if(ol){out.push('</ol>');ol=false;}if(!ul){out.push('<ul>');ul=true;}out.push('<li>'+il(ln.slice(2))+'</li>');continue;}
    if (/^\d+\.\s/.test(ln)){if(ul){out.push('</ul>');ul=false;}if(!ol){out.push('<ol>');ol=true;}out.push('<li>'+il(ln.replace(/^\d+\.\s/,''))+'</li>');continue;}
    if (/^---+$/.test(ln.trim())){cl();out.push('<hr>');continue;}
    cl(); if (!ln.trim()) { out.push(''); continue; } out.push('<p>'+il(ln)+'</p>');
  }
  flushTbl(); cl();
  return out.join('').replace(/\x00C(\d+)\x00/g, (_,i) => cbs[i]);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDT(iso){ try { return new Date(iso).toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}); } catch { return ''; } }

// ── Feed helpers ───────────────────────────────────────────────────────────
function scrollFeed() { const f=document.getElementById('feed'); f.scrollTop=f.scrollHeight; }

function makeBubble(role, content, meta={}) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble';
  if (role === 'user') {
    wrap.innerHTML = '<div class="bubble-query">' + esc(content) + '</div>';
    if (meta.ts) wrap.innerHTML += '<div class="bubble-meta" style="justify-content:flex-end"><span>' + fmtDT(meta.ts) + '</span></div>';
  } else {
    const ansId = 'ans-' + Date.now() + Math.random().toString(36).slice(2);
    wrap.innerHTML =
      '<div class="bubble-answer" id="' + ansId + '">' + (content ? md(content) : '<span class="thinking-dots">…</span>') + '</div>' +
      '<div class="bubble-meta">' +
        (meta.ts ? '<span>' + fmtDT(meta.ts) + '</span>' : '') +
        (meta.ai ? '<span class="ai-badge">' + esc(meta.ai) + '</span>' : '') +
        (meta.searched ? '<span class="search-badge">&#x1F50D; web</span>' : '') +
        '<button class="copy-btn" onclick="copyBubble(this)" title="Copy">&#x2398;</button>' +
      '</div>';
    wrap._ansId = ansId;
  }
  return wrap;
}

function copyBubble(btn) {
  const b = btn.closest('.bubble').querySelector('.bubble-answer');
  if (!b) return;
  navigator.clipboard.writeText(b.innerText).then(() => { btn.textContent='✓'; setTimeout(()=>btn.textContent='⎘',1200); });
}

// ── History loading ────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const data = await fetch('/api/history?limit=200').then(r=>r.json());
    const msgs = data.messages || [];
    history = [];
    for (let i=0; i<msgs.length; i++) {
      if (msgs[i]?.role==='user' && msgs[i+1]?.role==='assistant') {
        history.push({ user: msgs[i].content, assistant: msgs[i+1].content, ts: msgs[i].created_at, ai: msgs[i+1].ai_provider||'' });
        i++;
      }
    }
    if (history.length) { /* fresh page on load — don't auto-show the last exchange; use the ← nav to browse back into it */ }
  } catch(e) { console.warn('loadHistory:', e); }
}

function showHistItem(idx) {
  if (idx < 0 || idx >= history.length) return;
  histIdx = idx;
  const p = history[idx];
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  feed.appendChild(makeBubble('user', p.user, { ts: p.ts }));
  feed.appendChild(makeBubble('assistant', p.assistant, { ts: p.ts, ai: p.ai }));
  scrollFeed();
}

function navHist(dir) {
  if (!history.length) return;
  const next = histIdx === -1 ? history.length - 1 + (dir === 1 ? 0 : 0) : histIdx + dir;
  if (next < 0 || next >= history.length) return;
  showHistItem(next);
}

// ── Image handling ─────────────────────────────────────────────────────────
function handleImgFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = ev => {
      attachedImgs.push({ base64: ev.target.result.split(',')[1], mimeType: f.type, dataUrl: ev.target.result });
      renderImgPreviews();
    };
    reader.readAsDataURL(f);
  }
}
document.addEventListener('paste', e => {
  for (const item of (e.clipboardData?.items||[])) {
    if (item.type.startsWith('image/')) { handleImgFiles([item.getAsFile()]); break; }
  }
});
function renderImgPreviews() {
  const el = document.getElementById('attach-preview');
  el.innerHTML = attachedImgs.map((im,i) =>
    '<div class="attach-thumb"><img src="'+im.dataUrl+'"><button class="attach-remove" onclick="removeImg('+i+')">×</button></div>'
  ).join('');
  el.className = attachedImgs.length ? 'has-items' : '';
}
function removeImg(i) { attachedImgs.splice(i,1); renderImgPreviews(); }

// ── Document handling ──────────────────────────────────────────────────────
let docsOpen = false;
function toggleDocs() { docsOpen=!docsOpen; document.getElementById('docs-panel').className=docsOpen?'open':''; if(docsOpen) loadDocList(); }

// One window at a time: close our panel immediately, then hand off to
// whichever external picker the user chose. Neither of these can be
// force-closed by us once open (native OS dialog / another browser tab),
// but they're never both open from our side.
function openLocalPicker() {
  if (docsOpen) toggleDocs();
  document.getElementById('docInput').click();
}
function openGoogleDrive() {
  if (docsOpen) toggleDocs();
  window.open('https://drive.google.com/drive/folders/1VVnAQfq___O30Jz7wW_ovRNQdk8jQdLj', '_blank');
}

async function loadDocList() {
  const el = document.getElementById('dp-list');
  try {
    const data = await fetch('/api/docs').then(r=>r.json());
    if (!data.docs?.length) { el.innerHTML='<div class="dp-empty">No documents yet.</div>'; return; }
    el.innerHTML = data.docs.map(d => {
      let status;
      if (!d.chunks) status = '<span style="color:var(--text-dim)">not indexed</span>';
      else if (d.embedded === d.chunks) status = '<span style="color:var(--green-light)">&#x2713; searchable</span>';
      else status = '<span style="color:var(--text-dim)">'+d.embedded+'/'+d.chunks+' embedded</span>';
      return '<div class="dp-item"><span class="dp-item-name" title="'+esc(d.filename)+'">'+esc(d.filename)+'</span>' +
        '<span style="font-size:10px;margin:0 6px;flex-shrink:0">'+status+'</span>' +
        '<button class="dp-item-del" onclick="deleteDoc(\''+encodeURIComponent(d.filename)+'\',this)" title="Delete">&#x2715;</button></div>';
    }).join('');
  } catch { el.innerHTML='<div class="dp-empty">Error loading docs.</div>'; }
}

async function handleDocFiles(files) {
  if (docsOpen) toggleDocs(); // close the library modal so the chip list below isn't hidden behind it
  const preview = document.getElementById('doc-attach-preview');
  preview.className = 'has-items';

  // Render every file's chip immediately, all as "waiting" — the full list
  // is visible up front, before any upload has started.
  const items = Array.from(files).map(f => {
    const chip = document.createElement('div'); chip.className = 'doc-chip';
    chip.innerHTML = '<span>'+esc(f.name)+'</span><span style="color:var(--text-dim)"> waiting…</span>';
    preview.appendChild(chip);
    return { file: f, chip };
  });

  // Upload one at a time (server-side embedding work makes true parallel
  // uploads risky), but every chip's status is visible the whole time.
  for (const { file: f, chip } of items) {
    chip.innerHTML = '<span>'+esc(f.name)+'</span><span style="color:var(--text-dim)"> uploading…</span>';
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await fetch('/api/docs/upload', { method:'POST', body:fd }).then(x=>x.json());
      if (r.ok && r.text) {
        attachedDocs.push({ filename: r.filename, text: r.text });
        chip.innerHTML = '<span>✓ '+esc(r.filename)+' (will be sent with your next message)</span><button class="doc-chip-remove" onclick="removeAttachedDoc(\''+esc(r.filename)+'\',this)">×</button>';
      } else {
        chip.innerHTML = '<span style="color:var(--red)">✗ '+esc(f.name)+' — '+esc(r.error||'upload failed, not attached')+'</span><button class="doc-chip-remove" onclick="this.parentElement.remove()">×</button>';
      }
    } catch (e) {
      chip.innerHTML = '<span style="color:var(--red)">✗ '+esc(f.name)+' — network error, not attached</span><button class="doc-chip-remove" onclick="this.parentElement.remove()">×</button>';
    }
  }
  loadDocList();
}

function removeAttachedDoc(filename, btn) {
  attachedDocs = attachedDocs.filter(d => d.filename !== filename);
  btn.parentElement.remove();
}

async function deleteDoc(encodedName, btn) {
  if (!confirm('Delete "'+decodeURIComponent(encodedName)+'"?')) return;
  await fetch('/api/docs/'+encodedName, { method:'DELETE' });
  btn.closest('.dp-item').remove();
}

async function triggerDriveSync() {
  const panelBtn = document.getElementById('drive-sync-btn');
  const iconBtn = document.getElementById('drive-refresh-btn');
  if (panelBtn) { panelBtn.textContent = 'Syncing…'; panelBtn.disabled = true; }
  if (iconBtn) { iconBtn.disabled = true; iconBtn.style.opacity = '0.5'; iconBtn.title = 'Syncing…'; }
  try {
    const r = await fetch('/api/drive/sync', { method:'POST' }).then(x=>x.json());
    if (panelBtn) panelBtn.textContent = r.ok ? 'Sync started' : ('Error: '+r.message);
    if (iconBtn) iconBtn.title = r.ok ? 'Sync started' : ('Error: '+r.message);
    setTimeout(() => {
      if (panelBtn) { panelBtn.textContent='Sync now'; panelBtn.disabled=false; }
      if (iconBtn) { iconBtn.disabled=false; iconBtn.style.opacity='1'; iconBtn.title='Sync Google Drive now'; }
      loadDocList();
    }, 3000);
  } catch(e) {
    if (panelBtn) { panelBtn.textContent = 'Failed'; panelBtn.disabled = false; }
    if (iconBtn) { iconBtn.disabled = false; iconBtn.style.opacity='1'; iconBtn.title = 'Failed — try again'; }
  }
}

// ── Send ───────────────────────────────────────────────────────────────────
async function handleSend() {
  const input = document.getElementById('qinput');
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true;
  input.value = ''; input.style.height = 'auto';
  histIdx = -1;
  const imgs = attachedImgs.slice(); attachedImgs = []; renderImgPreviews();
  const docs = attachedDocs.slice(); attachedDocs = [];
  console.log('[send] docs attached to this message:', docs.map(d=>d.filename)); // verifiable proof of what's actually being sent
  document.getElementById('doc-attach-preview').innerHTML = '';
  document.getElementById('doc-attach-preview').className = '';

  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  // User bubble
  let userContent = q;
  if (imgs.length) {
    userContent = '[image attached] ' + q;
  }
  feed.appendChild(makeBubble('user', userContent));

  // Assistant bubble (streaming)
  const aiBubble = makeBubble('assistant', '');
  feed.appendChild(aiBubble);
  const ansEl = document.getElementById(aiBubble._ansId);
  ansEl.innerHTML = '<span class="thinking-dots">thinking…</span>';
  scrollFeed();

  let full = ''; let usedModel = ''; let searched = false;

  try {
    const body = { query: q };
    if (imgs.length) body.images = imgs.map(i=>({base64:i.base64,mimeType:i.mimeType}));
    if (docs.length) body.docs = docs.map(d=>({filename:d.filename,text:d.text}));

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(120000)
    });

    const reader = res.body.getReader(); const dec = new TextDecoder();
    ansEl.innerHTML = '';

    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      for (const line of dec.decode(value).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim(); if (raw === '[DONE]') break;
        try {
          const obj = JSON.parse(raw);
          if (obj.event) {
            if (obj.event.startsWith('model:')) usedModel = obj.event.slice(6);
            if (obj.event.startsWith('searching')) {
              searched = true;
              document.getElementById('status-dot').className = 'searching';
            }
            if (obj.event.startsWith('error:not-configured:')) {
              full += '\n\n⚠ That model isn\'t configured on this deployment (missing API key).';
              ansEl.innerHTML = md(full);
            }
            if (obj.event.startsWith('error:unknown-model:')) {
              full += '\n\n⚠ Unknown model — try Ask: Gemini, Ask: Mistral, Ask: Cerebras, or Ask: Groq.';
              ansEl.innerHTML = md(full);
            }
          }
          if (obj.token) { full += obj.token; ansEl.innerHTML = md(full); scrollFeed(); }
          if (obj.error) { ansEl.innerHTML += '<div style="color:var(--red);font-size:12px;margin-top:6px">⚠ '+esc(obj.error)+'</div>'; }
        } catch {}
      }
    }

    document.getElementById('status-dot').className = '';
    // Update meta row
    const meta = aiBubble.querySelector('.bubble-meta');
    if (meta) {
      meta.innerHTML =
        '<span>'+fmtDT(new Date().toISOString())+'</span>'+
        (usedModel ? '<span class="ai-badge">'+esc(usedModel)+'</span>' : '')+
        (searched ? '<span class="search-badge">&#x1F50D; web</span>' : '')+
        '<button class="copy-btn" onclick="copyBubble(this)" title="Copy">&#x2398;</button>';
    }
    // Add to local history
    history.push({ user: q, assistant: full, ts: new Date().toISOString(), ai: usedModel });

  } catch(e) {
    ansEl.innerHTML = '<div style="color:var(--red)">'+esc(e.message)+'</div>';
    document.getElementById('status-dot').className = 'offline';
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  scrollFeed();
}

// ── Keyboard ───────────────────────────────────────────────────────────────
const qinput = document.getElementById('qinput');
qinput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); handleSend(); }
});
qinput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});
document.addEventListener('keydown', e => {
  if (document.activeElement === qinput) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navHist(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navHist(1); }
});

// ── Init ───────────────────────────────────────────────────────────────────
loadHistory();
checkStatus();

// ── Service Worker registration ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(r => console.log('SW registered')).catch(e => console.warn('SW:', e));
}
</script>
