[package]
name = "mobius-desktop"
version = "0.2.0"
description = "Mobius desktop shell - the live Mobius pages in a native window, with a door to local tools"
authors = ["Boon Lay Ong"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri      = { version = "2.11.0", features = [] }
tokio      = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

